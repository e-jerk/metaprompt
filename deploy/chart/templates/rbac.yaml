apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.mcp }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "metaprompt.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.job }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "metaprompt.labels" . | nindent 4 }}
  {{- with .Values.bedrock.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metaprompt-mcp
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["metaprompt.io"]
    resources: ["harnessjobs", "harnessjobs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "persistentvolumeclaims", "secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metaprompt-mcp
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.mcp }}
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: metaprompt-mcp
  apiGroup: rbac.authorization.k8s.io
