apiVersion: v1
kind: Secret
metadata:
  name: metaprompt-tokens
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "metaprompt.labels" . | nindent 4 }}
type: Opaque
stringData:
  run-token-secret: "change-me-in-real-clusters"
  static-users.json: |
    {{ .Values.auth.staticUsers | toJson }}
---
apiVersion: v1
kind: Secret
metadata:
  name: metaprompt-vcs
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "metaprompt.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Central store for git-sync + jj mint. Never mount this on harness Jobs.
  placeholder: "replace-with-repo-pats"
