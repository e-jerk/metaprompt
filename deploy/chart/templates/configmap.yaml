apiVersion: v1
kind: ConfigMap
metadata:
  name: metaprompt-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "metaprompt.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "namespace": {{ .Values.namespace | quote }},
      "limits": {{ .Values.limits | toJson }},
      "bedrock": {
        "enabled": {{ .Values.bedrock.enabled }},
        "region": {{ .Values.bedrock.region | quote }}
      },
      {{- $ac := .Values.bedrock.agentcore | default dict }}
      "agentcore": {
        "enabled": {{ $ac.enabled | default false }},
        "region": {{ $ac.region | default .Values.bedrock.region | quote }},
        "harnessArn": {{ $ac.harnessArn | default "" | quote }},
        "runtimeArn": {{ $ac.runtimeArn | default "" | quote }},
        "qualifier": {{ $ac.qualifier | default "" | quote }},
        "gatewayUrl": {{ $ac.gatewayUrl | default "" | quote }},
        "gatewayArn": {{ $ac.gatewayArn | default "" | quote }},
        "planeExternalUrl": {{ $ac.planeExternalUrl | default "" | quote }},
        "memoryArn": {{ $ac.memoryArn | default "" | quote }},
        "memoryNamespace": {{ $ac.memoryNamespace | default "/actors/{actorId}" | quote }},
        "awsSkillPaths": {{ $ac.awsSkillPaths | default list | toJson }},
        "maxIterations": {{ $ac.maxIterations | default 0 }},
        "maxTokens": {{ $ac.maxTokens | default 0 }},
        "timeoutSeconds": {{ $ac.timeoutSeconds | default 0 }},
        "attachPlaneMcp": {{ hasKey $ac "attachPlaneMcp" | ternary $ac.attachPlaneMcp true }},
        "enableBrowser": {{ $ac.enableBrowser | default false }},
        "enableCodeInterpreter": {{ $ac.enableCodeInterpreter | default false }}
      },
      "oidc": {{ .Values.auth.oidc | toJson }},
      {{- $apps := .Values.auth.apps | default dict }}
      {{- $gh := $apps.github | default dict }}
      "github": {
        "appId": {{ $gh.appId | default "" | quote }},
        "installationId": {{ $gh.installationId | default "" | quote }}
      },
      "oidcApps": {
        "tokenFile": {{ $apps.tokenFile | default "/var/run/secrets/kubernetes.io/serviceaccount/token" | quote }},
        "apps": {{ $apps.extras | default list | toJson }}
      },
      "gitSync": {
        "enabled": {{ .Values.gitSync.enabled }},
        "hostPath": {{ .Values.gitSync.hostPath | quote }}
      },
      "localAuth": {{ .Values.localAuth | default (dict "mounts" list) | toJson }}{{- if .Values.assets }},
      "assets": {{ .Values.assets | toJson }}{{- end }}
    }
