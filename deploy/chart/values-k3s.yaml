auth:
  staticUsers:
    - user: local-dev
      token: local-dev-token
      groups: [eng]
      admin: true
    - user: alice
      token: alice-token
      groups: [eng]
    - user: bob
      token: bob-token
      groups: [eng]

storage:
  mode: hostpath
  storageClass: local-path
  size: 2Gi

bedrock:
  enabled: false
  region: us-east-1
  agentcore:
    enabled: false

image:
  pullPolicy: IfNotPresent

# k3d serverlb publishes 127.0.0.1:3333 → this Service. No kubectl port-forward.
mcp:
  service:
    type: LoadBalancer

# Local fixture. Jobs that pass assets: ["eval-set"] mount this hostPath read-only.
assets:
  - name: eval-set
    volume: hostPath:/var/lib/metaprompt/assets/eval-set
    mountPath: /assets/eval-set
    readers: [group:eng, public]

# e-jerk/metaprompt is not required for local MCP/Job smoke. Enable to mount /repos as Job lowerdir.
gitSync:
  enabled: false

# Cursor CLI login from the laptop. `scripts/materialize-cursor-auth.sh` writes
# ~/.metaprompt/creds/cursor; k3d bind-mounts that dir onto the node.
localAuth:
  mounts:
    # Writable: `agent` also creates ~/.cursor/projects. Creds are the same dir.
    - name: cursor
      hostPath: /var/lib/metaprompt/creds/cursor
      mountPath: /root/.cursor
      harnesses: [cursor, session]
      readOnly: false
    - name: cursor-xdg
      hostPath: /var/lib/metaprompt/creds/cursor
      mountPath: /root/.config/cursor
      harnesses: [cursor, session]

memory:
  enabled: true
  embeddingProvider: hash
  embeddingDim: 64
  postgres:
    password: local-dev-memory
    storageClass: local-path
    storageSize: 2Gi
