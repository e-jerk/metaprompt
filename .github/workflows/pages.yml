name: pages
on:
  push:
    branches: [main]
    paths: [site/**, skills/**, scripts/sync-site.sh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/sync-site.sh
      # .nojekyll must ship so agents get raw .md (not Jekyll HTML).
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v4
